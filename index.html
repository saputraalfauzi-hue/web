<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusat Website | Koleksi Inspirasi Web</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      transition: background 0.3s ease, color 0.2s;
      position: relative;
      min-height: 100vh;
    }
    body.dark {
      animation: auroraDark 14s ease infinite alternate;
      color: #e2e8f0;
    }
    body.light {
      animation: auroraLight 12s ease infinite alternate;
      color: #0f172a;
    }
    @keyframes auroraDark {
      0% {
        background: radial-gradient(circle at 30% 40%, #0a192f, #020617);
      }
      25% {
        background: radial-gradient(circle at 70% 30%, #0f2b3f, #030712);
      }
      50% {
        background: radial-gradient(circle at 50% 70%, #0b2b3b, #010314);
      }
      75% {
        background: radial-gradient(circle at 85% 55%, #102c3c, #020512);
      }
      100% {
        background: radial-gradient(circle at 20% 80%, #0e2a3a, #01031a);
      }
    }
    @keyframes auroraLight {
      0% {
        background: radial-gradient(circle at 30% 40%, #e0e7ff, #f1f5f9, #ffffff);
      }
      25% {
        background: radial-gradient(circle at 70% 30%, #d9f9f9, #eef2ff, #fafcff);
      }
      50% {
        background: radial-gradient(circle at 50% 70%, #cbdffc, #ffffff, #f0f4fe);
      }
      75% {
        background: radial-gradient(circle at 85% 55%, #d4e4ff, #f8fafc, #ffffff);
      }
      100% {
        background: radial-gradient(circle at 20% 80%, #bdd3ff, #fefefe, #eef2fa);
      }
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 1.5rem 2rem 2rem;
      position: relative;
      z-index: 2;
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 1rem;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .logo {
      background: #0b2b3b;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 1.8rem;
      font-weight: 800;
      font-family: monospace;
      color: #7dd3fc;
      box-shadow: 0 0 8px #38bdf8;
      border: 1px solid #38bdf8;
    }
    body.light .logo {
      background: #1e3a5f;
      color: #7dd3fc;
    }
    .site-title {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #bae6fd, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .theme-toggle,
    .btn-add-wa,
    .more-btn,
    .close-fullscreen {
      border: 1px solid #38bdf8;
      border-radius: 40px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
      background: transparent;
    }
    body.dark .theme-toggle,
    body.dark .btn-add-wa,
    body.dark .more-btn,
    body.dark .close-fullscreen {
      color: #ffffff;
      background: radial-gradient(ellipse at 30% 30%, #0b2f45, #051a2a);
    }
    body.light .theme-toggle,
    body.light .btn-add-wa,
    body.light .more-btn,
    body.light .close-fullscreen {
      color: #000000;
      background: #e2e8f0;
    }
    .search-wrapper {
      flex: 1;
      max-width: 340px;
      min-width: 200px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: #0f172ad9;
      backdrop-filter: blur(4px);
      border-radius: 60px;
      padding: 0.6rem 1.2rem;
      border: 1px solid #1e2a3e;
    }
    body.light .search-box {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .search-box:focus-within {
      border-color: #38bdf8;
    }
    .search-box i {
      color: #5ee0fa;
      margin-right: 10px;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      color: inherit;
      font-size: 0.95rem;
    }
    .websites-section h2 {
      font-size: 1.7rem;
      margin: 1.5rem 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .scrolling-grid {
      overflow-x: auto;
      padding-bottom: 1rem;
    }
    .website-grid {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(2, minmax(310px, auto));
      gap: 1.8rem;
      width: max-content;
    }
    .website-card {
      width: 280px;
      background: #0e1625e6;
      backdrop-filter: blur(2px);
      border-radius: 28px;
      border: 1px solid #1e2a44;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s;
    }
    body.light .website-card {
      background: #ffffffcc;
      border-color: #cbd5e1;
    }
    .website-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }
    .card-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #07121f;
    }
    .card-info {
      padding: 1rem;
    }
    .card-info h3 {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }
    .empty-msg {
      text-align: center;
      padding: 3rem;
      font-size: 1.1rem;
    }
    .error-msg {
      background: #991b1b80;
      border-left: 4px solid #ef4444;
      padding: 1rem;
      border-radius: 16px;
      margin-bottom: 1rem;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 20, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .modal-container {
      background: #0e1625f2;
      border-radius: 2rem;
      max-width: 600px;
      width: 90%;
      border: 1px solid #2d3a5e;
      max-height: 85vh;
      overflow-y: auto;
    }
    body.light .modal-container {
      background: #ffffffdd;
      border-color: #cbd5e1;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 1rem 1.8rem;
      border-bottom: 1px solid #1e2f46;
      flex-wrap: wrap;
    }
    .modal-header h3 {
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .creator-name {
      font-size: 0.8rem;
      background: #1e2a3e;
      padding: 4px 10px;
      border-radius: 40px;
      font-weight: normal;
    }
    body.light .creator-name {
      background: #e2e8f0;
      color: #0f172a;
    }
    .share-btns {
      display: flex;
      gap: 12px;
    }
    .share-icon {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: #7dd3fc;
    }
    .close-modal {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #94a3b8;
    }
    .modal-body {
      padding: 1.6rem;
    }
    .url-block {
      background: #030b17;
      border-radius: 40px;
      padding: 0.4rem 1rem;
      display: inline-block;
      margin-bottom: 1rem;
    }
    body.light .url-block {
      background: #eef2ff;
    }
    .fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 20, 0.97);
      backdrop-filter: blur(12px);
      z-index: 1100;
      overflow-y: auto;
      padding: 2rem;
      display: none;
    }
    .fullscreen-overlay.active {
      display: block;
    }
    body.light .fullscreen-overlay {
      background: rgba(240, 245, 255, 0.95);
    }
    .fullscreen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .fullscreen-search {
      flex: 1;
      max-width: 400px;
      border-radius: 60px;
      padding: 0.6rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172ad9;
      border: 1px solid #1e2a3e;
    }
    body.light .fullscreen-search {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .fullscreen-search i {
      color: #5ee0fa;
    }
    .fullscreen-search input {
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      font-size: 0.95rem;
      color: inherit;
    }
    .fullscreen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.8rem;
    }
    .footer-support {
      margin-top: 3rem;
      padding: 1.5rem;
      text-align: center;
      border-top: 1px solid #1e2a3e;
    }
    @media (max-width: 720px) {
      .container { padding: 1rem; }
      .header { flex-direction: column; align-items: stretch; }
      .search-wrapper { max-width: 100%; }
      .website-card { width: 240px; }
    }
  </style>
</head>
<body class="dark">
  <div class="container">
    <div class="header">
      <div class="logo-area">
        <div class="logo">{/}</div>
        <div class="site-title">pusat website</div>
      </div>
      <div class="search-wrapper">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Cari website...">
        </div>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i> Mode</button>
        <button class="btn-add-wa" id="addWebsiteBtn"><i class="fab fa-whatsapp"></i> Tambah</button>
        <button class="more-btn" id="moreBtn"><i class="fas fa-th-large"></i> Lebih Banyak</button>
      </div>
    </div>
    <div class="websites-section">
      <h2>✨ Koleksi Website <span style="font-size:0.8rem;">(geser horizontal →)</span></h2>
      <div class="scrolling-grid">
        <div class="website-grid" id="websiteGrid"></div>
        <div id="emptyMessage" class="empty-msg" style="display: none;">📭 Memuat data...</div>
      </div>
    </div>
    <div class="footer-support">
      <p><i class="fas fa-code"></i> Wujudkan website impian bersama kami</p>
      <p style="font-size:0.8rem;">"Bangun identitas digital dengan desain modern, cepat, dan aman."</p>
    </div>
  </div>

  <div id="detailModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <div class="share-btns">
          <button class="share-icon" id="shareWA"><i class="fab fa-whatsapp"></i></button>
          <button class="share-icon" id="shareCopy"><i class="fas fa-link"></i></button>
          <button class="close-modal" id="closeModalBtn">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="url-block"><i class="fas fa-globe"></i> <a href="#" id="modalUrl" target="_blank">Kunjungi Website</a></div>
        <p id="modalDescription" style="margin: 12px 0;"></p>
        <div style="margin-top: 16px; text-align: right;">
          <a href="#" id="modalVisitBtn" target="_blank" style="color:#7dd3fc;">Buka langsung →</a>
        </div>
      </div>
    </div>
  </div>

  <div id="fullscreenOverlay" class="fullscreen-overlay">
    <div class="fullscreen-header">
      <h2><i class="fas fa-th"></i> Semua Website</h2>
      <div class="fullscreen-search">
        <i class="fas fa-search"></i>
        <input type="text" id="fullscreenSearch" placeholder="Cari website...">
      </div>
      <button class="close-fullscreen" id="closeFullscreenBtn">✕ Tutup</button>
    </div>
    <div id="fullscreenGrid" class="fullscreen-grid"></div>
  </div>

  <script>
    let websitesData = [];
    let currentData = [];

    const FALLBACK_DATA = [
      {
        id: 1,
        name: "Web Code Storage",
        desc: "Newly import code html, css, dan JavaScript",
        url: "https://saputraalfauzi-hue.github.io/2sajiwo/",
        image: "images/1.jpg",
        creator: "Bagus"
      },
      {
        id: 2,
        name: "Canvas",
        desc: "website untuk menggambar",
        url: "https://saputraalfauzi-hue.github.io/Canvas/",
        image: "images/2.jpg",
        creator: "Bagas"
      },
      {
        id: 3,
        name: "Komponen PC",
        desc: "Eksplorasi 11 komponen esensial - dari prosesor hingga tempa pabrik. Desain elegan, informasi presisi.",
        url: "https://saputraalfauzi-hue.github.io/Pengenalan_Hardware/",
        image: "images/3.jpg",
        creator: "Bagas"
      }
    ];

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function renderGrids() {
      const gridContainer = document.getElementById('websiteGrid');
      const emptyDiv = document.getElementById('emptyMessage');
      if (!gridContainer) return;
      if (currentData.length === 0) {
        gridContainer.style.display = 'none';
        emptyDiv.style.display = 'block';
        emptyDiv.innerText = '📭 Belum ada website. Hubungi owner untuk menambahkan.';
      } else {
        gridContainer.style.display = 'grid';
        emptyDiv.style.display = 'none';
        gridContainer.innerHTML = '';
        currentData.forEach(web => {
          const card = document.createElement('div');
          card.className = 'website-card';
          card.innerHTML = `
            <img class="card-img" src="${web.image || 'https://placehold.co/400x250/0c1a2b/38bdf8?text=No+Preview'}" alt="${web.name}" onerror="this.src='https://placehold.co/400x250/1e2a4a/7dd3fc?text=preview'">
            <div class="card-info">
              <h3>${escapeHtml(web.name)}</h3>
              <p>${escapeHtml(web.desc.substring(0, 70))}${web.desc.length > 70 ? '...' : ''}</p>
            </div>
          `;
          card.addEventListener('click', () => openModal(web));
          gridContainer.appendChild(card);
        });
      }
      renderFullscreen();
    }

    function renderFullscreen() {
      const fsGrid = document.getElementById('fullscreenGrid');
      if (!fsGrid) return;
      const searchTerm = document.getElementById('fullscreenSearch')?.value.toLowerCase() || '';
      let filtered = websitesData.filter(w => w.name.toLowerCase().includes(searchTerm) || w.desc.toLowerCase().includes(searchTerm));
      if (filtered.length === 0) {
        fsGrid.innerHTML = '<div class="empty-msg" style="grid-column:1/-1;">Tidak ada website ditemukan</div>';
        return;
      }
      fsGrid.innerHTML = '';
      filtered.forEach(web => {
        const card = document.createElement('div');
        card.className = 'website-card';
        card.style.width = '100%';
        card.innerHTML = `
          <img class="card-img" src="${web.image || 'https://placehold.co/400x250/0c1a2b/38bdf8?text=preview'}" onerror="this.src='https://placehold.co/400x250/1e2a4a/7dd3fc?text=preview'">
          <div class="card-info">
            <h3>${escapeHtml(web.name)}</h3>
            <p>${escapeHtml(web.desc.substring(0, 80))}</p>
          </div>
        `;
        card.addEventListener('click', () => { openModal(web); closeFullscreen(); });
        fsGrid.appendChild(card);
      });
    }

    function openModal(web) {
      const modal = document.getElementById('detailModal');
      document.getElementById('modalTitle').innerHTML = `${escapeHtml(web.name)} <span class="creator-name"><i class="fas fa-user-pen"></i> ${escapeHtml(web.creator || 'Admin')}</span>`;
      document.getElementById('modalUrl').href = web.url;
      document.getElementById('modalUrl').innerText = web.url.replace(/^https?:\/\//, '');
      document.getElementById('modalVisitBtn').href = web.url;
      document.getElementById('modalDescription').innerText = web.desc;
      modal.classList.add('active');
      window.currentShareWeb = web;
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    function openFullscreen() {
      document.getElementById('fullscreenOverlay').classList.add('active');
      renderFullscreen();
    }

    function closeFullscreen() {
      document.getElementById('fullscreenOverlay').classList.remove('active');
    }

    function filterWebsites() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      if (term === '') currentData = [...websitesData];
      else currentData = websitesData.filter(w => w.name.toLowerCase().includes(term) || w.desc.toLowerCase().includes(term));
      renderGrids();
    }

    function shareToWA(web) {
      if (!web) return;
      const text = `*${web.name}* - ${web.desc}\nKunjungi: ${web.url}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    function copyLink(web) {
      if (!web) return;
      navigator.clipboard.writeText(web.url);
      alert('Link website disalin!');
    }

    async function loadWebsites() {
      const emptyDiv = document.getElementById('emptyMessage');
      try {
        const response = await fetch('websites.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (Array.isArray(data) && data.length) {
          websitesData = data;
        } else {
          throw new Error('File kosong atau format salah');
        }
      } catch (err) {
        console.warn('Gagal baca websites.json, menggunakan data contoh:', err);
        websitesData = [...FALLBACK_DATA];
        const errorBox = document.createElement('div');
        errorBox.className = 'error-msg';
        errorBox.innerHTML = '⚠️ <strong>File websites.json tidak terbaca.</strong> Pastikan file tersedia dan jalankan di server (Live Server). Saat ini menggunakan data contoh.';
        const target = document.querySelector('.websites-section .scrolling-grid');
        if (target && !document.querySelector('.error-msg')) {
          target.parentNode.insertBefore(errorBox, target);
        }
      }
      currentData = [...websitesData];
      renderGrids();
    }

    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      document.body.classList.toggle('light');
      const isDark = document.body.classList.contains('dark');
      themeBtn.innerHTML = isDark ? '<i class="fas fa-moon"></i> Mode' : '<i class="fas fa-sun"></i> Mode';
    });
    document.body.classList.add('dark');

    document.getElementById('searchInput').addEventListener('input', filterWebsites);
    document.getElementById('addWebsiteBtn').addEventListener('click', () => {
      window.open('https://wa.me/6285704724126?text=Halo%2C%20saya%20ingin%20menambahkan%20website.%20Cara%3A%20edit%20websites.json%20(contoh%20diberikan)%20dan%20upload%20gambar%20ke%20folder%20images%2F', '_blank');
    });
    document.getElementById('moreBtn').addEventListener('click', openFullscreen);
    document.getElementById('closeFullscreenBtn').addEventListener('click', closeFullscreen);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('detailModal')) closeModal();
    });
    document.getElementById('fullscreenOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('fullscreenOverlay')) closeFullscreen();
    });
    document.getElementById('shareWA').addEventListener('click', () => {
      if (window.currentShareWeb) shareToWA(window.currentShareWeb);
    });
    document.getElementById('shareCopy').addEventListener('click', () => {
      if (window.currentShareWeb) copyLink(window.currentShareWeb);
    });
    document.getElementById('fullscreenSearch').addEventListener('input', renderFullscreen);

    loadWebsites();
  </script>
</body>
</html>
